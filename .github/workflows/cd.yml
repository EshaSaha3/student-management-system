name: Continuous Deployment

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/student-management:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository }}/student-management:${{ github.sha }} ghcr.io/${{ github.repository }}/student-management:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/student-management:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/student-management:latest

      - name: Create Release Artifact
        run: |
          mkdir -p release
          cp target/*.jar release/
          echo "${{ github.sha }}" > release/version.txt

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v3
        with:
          name: application-jar
          path: release/

  deploy-to-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # For example, using SSH to deploy to a server
          # or using cloud provider CLI

  deploy-to-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    environment:
      name: production
      url: https://your-production-url.com

    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here